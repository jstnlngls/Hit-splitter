name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packaging downloads the Electron build it needs; the local dev binary isn't used in CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mac:
    name: Mac app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package Hit Splitter.app and the .dmg installers
        run: npm run desktop:package
      - name: Launch the app and import the demo beat
        run: npm run desktop:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Hit-Splitter-mac
          path: release/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshot
          path: release/smoke.png
          if-no-files-found: ignore
      - name: Install into /Applications the way it's done on a Mac
        run: |
          npm run desktop:install
          codesign --verify --deep --strict "/Applications/Hit Splitter.app"
          # Built on the Mac itself, so nothing marks it as downloaded for Gatekeeper to check.
          if xattr -p com.apple.quarantine "/Applications/Hit Splitter.app" > /dev/null 2>&1; then
            echo "The installed app is quarantined, so Gatekeeper would stop it"
            exit 1
          fi

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hit-Splitter-mac
          path: dmg
      - name: Publish the GitHub release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: "Download the .dmg for your Mac (apple-silicon for M-series Macs, intel for older ones), open it, and drag Hit Splitter into Applications. The app isn't notarized by Apple: the first time you open it, go to System Settings → Privacy & Security and choose Open Anyway."
        run: |
          # A release published on github.com creates its tag, which starts this run: add the installers to it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dmg/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
            fi
          else
            gh release create "$GITHUB_REF_NAME" dmg/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hit Splitter $GITHUB_REF_NAME" \
              --notes "$NOTES"
          fi
