<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#131827"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- Rounded square on the macOS icon grid (824 of 1024). -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ground)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <!-- Four beats in the TR-808 step colors, each hit split into syllables. -->
  <g>
    <rect x="232" y="262" width="118" height="300" rx="30" fill="#e8481c"/>
    <rect x="232" y="590" width="118" height="172" rx="30" fill="#e8481c"/>
    <rect x="378" y="262" width="118" height="176" rx="30" fill="#f2a01f"/>
    <rect x="378" y="466" width="118" height="296" rx="30" fill="#f2a01f"/>
    <rect x="524" y="262" width="118" height="376" rx="30" fill="#f4d23a"/>
    <rect x="524" y="666" width="118" height="96" rx="30" fill="#f4d23a"/>
    <rect x="670" y="262" width="118" height="236" rx="30" fill="#eeeade"/>
    <rect x="670" y="526" width="118" height="236" rx="30" fill="#eeeade"/>
  </g>
</svg>
